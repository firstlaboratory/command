name: Debug tamil page
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re,urllib.request
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36'}
          h=urllib.request.urlopen(urllib.request.Request('https://calendar.tamildot.com/tamil-monthly-calendar/December-2026',headers=UA),timeout=25).read().decode('utf-8','replace')
          h=re.sub(r'\s+',' ',h); print('LEN',len(h))
          t=re.sub(r'<(/?)(tr|table|h\d)[^>]*>',r'\n<\1\2>',h); t=re.sub(r'<t[dh][^>]*>',' | ',t); t=re.sub(r'<script.*?</script>|<style.*?</style>','',t); t=re.sub(r'<[^>]+>','',t)
          lines=[l.strip() for l in t.split('\n') if l.strip()]
          for i,l in enumerate(lines):
              if any(k in l for k in ('Amavasai','Muhurtham','Festival','Pournami','Rahu','Nakshatra','Thithi','Tithi','Ekadashi','Pradosham','Karthigai','December, 2026')):
                  print(i,'::',l[:300])
          PY
