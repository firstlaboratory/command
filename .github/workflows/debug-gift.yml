          H2=dict(UA,Referer='https://www.nseix.com/',Accept='application/json, text/plain, */*')
          for u in ['/api/nifty-market-rate','/api/index-derivatives','/api/derivatives-watch?inst_type1=IDX&inst_type2=STK&type=live','/api/getquotes?symbol=NIFTY','/api/getquotes?symbol=GIFTNIFTY','/api/derivatives-market-status']:
