    steps:
      - run: |
          python3 - <<'PY'
          import re,urllib.request,json
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept':'*/*'}
          def g(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20);b=r.read().decode('utf-8','replace');return r.status,b
