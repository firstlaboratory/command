name: Debug gift nifty
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import re,urllib.request,json
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36','Accept':'*/*'}
          def g(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20);b=r.read().decode('utf-8','replace');return r.status,b
              except Exception as e: return 'ERR',str(e)
          for base in ['https://www.nseix.com/','https://live.giftcitynifty.com/']:
              s,h=g(base); print('HOME',base,s,len(h))
              srcs=re.findall(r'src="([^"]+\.js[^"]*)"',h); print('SRCS',srcs[:15])
              blobs=[h]+[g(js if js.startswith('http') else base.rstrip('/')+'/'+js.lstrip('/'))[1] for js in srcs[:10]]
              for b in blobs:
                  for m in set(re.findall(r'(https?://[A-Za-z0-9./_-]*(?:api|json|quote|market|gift|nifty)[A-Za-z0-9./_?=&-]*)',b,re.I)): print('URL',m[:160])
                  for m in set(re.findall(r'["\'`](/[A-Za-z0-9_/-]*(?:api|gift|market)[A-Za-z0-9_/?=&.-]*)["\'`]',b,re.I)): print('PATH',m[:120])
          PY
